language: en-US
tone_instructions: "Terse. Report only critical and major defects. No praise, no nitpicks, no style comments."
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimated_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**"
      instructions: |
        Only comment on issues that would cause a crash, memory corruption,
        data loss, a security vulnerability, or incorrect behaviour in
        production. Do not comment on style, naming, formatting, missing
        comments, refactoring ideas, minor performance, or anything
        speculative. If unsure that something is a real defect, stay silent.
        Prefer fewer, high-confidence comments.
    - path: "**/*.c"
      instructions: |
        Report only: buffer overflows or out-of-bounds access with
        attacker-controlled lengths, authentication or authorization bypass,
        hardcoded secrets or secret leakage, use-after-free, double free,
        NULL dereference, uninitialised use, divide-by-zero, and data races
        that corrupt state. Ignore everything else.
    - path: "**/*.py"
      instructions: |
        Report only: command injection, hardcoded credentials, and
        swallowed errors that hide failures. Ignore style.
    - path: ".github/workflows/**"
      instructions: |
        Report only: untrusted code checkout under pull_request_target,
        script injection from event context, write-all permissions, and
        secret exposure. Ignore everything else.
    - path: "**/prj.conf"
      instructions: |
        Report only config values that make the code crash or fail at
        runtime (for example a zero heap with k_malloc in use).
  tools:
    cppcheck:
      enabled: true
    semgrep:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    ruff:
      enabled: false
    yamllint:
      enabled: false
