# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Terse. Report only critical and major defects. No praise, no nitpicks, no style comments."
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimated_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/prj.conf"
    - "!**/CMakeLists.txt"
    - "!scripts/**"
  path_instructions:
    - path: "**"
      instructions: |
        Post at most 3 comments in total across the whole PR, only for the
        most severe defects (remote code execution, authentication bypass,
        memory corruption, secret exposure). Merge related findings into one
        comment. Skip everything else, including anything a linter reports.
    - path: "**/*.c"
      instructions: |
        Only report authentication/authorization bypass and
        attacker-controlled buffer overflows.
    - path: ".github/workflows/**"
      instructions: |
        Only report untrusted checkout under pull_request_target.
  tools:
    cppcheck:
      enabled: false
    semgrep:
      enabled: false
    gitleaks:
      enabled: false
    actionlint:
      enabled: false
    ruff:
      enabled: false
    yamllint:
      enabled: false
