# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
enable_free_tier: true

# Chill reviewer: only critical / application-breaking issues
tone_instructions: "Be relaxed and brief. Comment ONLY on bugs that crash, corrupt data, leak memory, cause security holes, or break the build. Ignore style, naming, typos, docs and TODOs."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"

  path_filters:
    - "!**/build/**"
    - "!**/*.lock"

  path_instructions:
    - path: "**/*"
      instructions: |
        Report only critical or major defects: crashes, NULL dereferences, memory corruption or leaks,
        buffer overflows, data loss, security vulnerabilities, deadlocks, and build breakages.
        Do NOT comment on formatting, naming, comments, typos, missing docs or type hints, TODOs,
        logging style, magic numbers, or other cosmetic or minor issues.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"

  tools:
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    shellcheck:
      enabled: false
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    cppcheck:
      enabled: true
    clang:
      enabled: false
    languagetool:
      enabled: false
    checkov:
      enabled: false
    gitleaks:
      enabled: true
    actionlint:
      enabled: false
    github-checks:
      enabled: false

chat:
  auto_reply: true
