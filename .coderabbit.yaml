# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
enable_free_tier: true

# Assertive, nitpicky reviewer
tone_instructions: "Be strict and exacting. Flag every issue, including style, naming, typos, comments, and formatting nits. Be direct, concise, and specific."

reviews:
  profile: "assertive"            # most feedback, including nitpicks
  request_changes_workflow: true  # block merge until comments are resolved
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  review_status: true
  collapse_walkthrough: false
  poem: false
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - ".*"

  path_filters:
    - "!**/build/**"
    - "!**/*.lock"

  path_instructions:
    - path: "**/*.{c,h,cpp,hpp}"
      instructions: |
        Review as strict Zephyr/embedded C. Flag: unchecked return values, missing NULL/bounds checks,
        magic numbers, missing const/static, unused variables/includes, integer overflow/signedness issues,
        non-Zephyr-style naming, missing LOG_* usage or wrong log level, blocking calls in ISR context,
        missing error handling/cleanup paths, inconsistent formatting (Zephyr coding style, tabs),
        typos in comments, and TODO/FIXME without an issue reference.
    - path: "**/*.{dts,dtsi,overlay}"
      instructions: |
        Check devicetree style: node/label naming, property ordering, missing status, unit-address
        mismatches, hardcoded values that should be macros, and missing comments for non-obvious settings.
    - path: "**/Kconfig*"
      instructions: |
        Flag missing help text, missing dependencies/defaults, unclear prompts, wrong option naming,
        and inconsistent indentation.
    - path: "**/{CMakeLists.txt,*.cmake}"
      instructions: |
        Flag deprecated CMake usage, missing target_* scoping, hardcoded paths, and unsorted source lists.
    - path: "**/*.{conf,yml,yaml,json}"
      instructions: |
        Flag duplicate keys, unused or redundant settings, inconsistent formatting, and unexplained values.
    - path: "**/*.py"
      instructions: |
        Flag missing type hints, bare except, unused imports, mutable default args, missing docstrings,
        PEP 8 violations, and unclear naming.
    - path: "**/*.{md,rst}"
      instructions: |
        Flag typos, grammar errors, broken links, inconsistent heading style, outdated instructions,
        and missing code fence languages.
    - path: ".github/**"
      instructions: |
        Flag unpinned actions, overly broad permissions, missing timeouts, and secrets exposure risks.

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: "warning"
      threshold: 80
    title:
      mode: "warning"
      requirements: "Start with an imperative verb, keep under 72 characters, and include the requirement or ticket ID (e.g. [REQ-123])."
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "Safety Requirement Traceability"
        mode: "error"
        instructions: "Pass/fail: Every PR that changes C/C++ source, devicetree, or Kconfig must reference at least one requirement or ticket ID (e.g. REQ-123, JIRA-456) in the PR description, and state the safety integrity level (QM, ASIL-A/B/C/D) of the touched components. Fail if either is missing. Docs-only and CI-only changes are exempt."
      - name: "No Dynamic Memory or Unsafe Constructs"
        mode: "error"
        instructions: "Pass/fail: Newly added or changed C/C++ code must not use malloc/calloc/realloc/free, recursion, goto, unbounded string functions (strcpy, strcat, sprintf, gets), or variable-length arrays. Zephyr k_malloc counts as dynamic memory. Fail and list each violation with file and line. Exempt test code and files under tests/ or scripts/."
      - name: "Return Values and Error Handling"
        mode: "warning"
        instructions: "Pass/fail: In new or changed C code, every call that can fail (allocation, driver, CAN/LIN/Ethernet, flash, ADC, kernel APIs) must have its return value checked and handled. Fail if a failure is silently ignored or the error path does not release resources."
      - name: "No Secrets or Hardcoded Credentials"
        mode: "error"
        instructions: "Pass/fail: The diff must not add hardcoded keys, passwords, tokens, certificates, or private keys, and must not embed fixed cryptographic seeds or default diagnostic (UDS) security-access keys. Fail on any such value. Placeholders referencing a secure key store are acceptable."
      - name: "Cybersecurity Impact Statement"
        mode: "warning"
        instructions: "Pass/fail: If the PR changes network, bootloader/OTA update, diagnostics (UDS/DoIP), authentication, or crypto code, the PR description must include a short cybersecurity impact statement (threat considered and mitigation) in line with UNECE R155/R156 and ISO/SAE 21434 practice. Fail if missing. Not applicable otherwise."
      - name: "Timing and Interrupt Safety"
        mode: "warning"
        instructions: "Pass/fail: Code that runs in ISR context or in time-critical tasks must not call blocking APIs (k_msleep, k_sleep, mutex or semaphore waits with K_FOREVER, printk/printf, file or network I/O). Fail and cite each blocking call. Flag any new busy-wait loops without a timeout."
      - name: "Safety-Critical Change Needs Tests"
        mode: "warning"
        instructions: "Pass/fail: A PR that changes application logic under app/, drivers/, or boards/ must add or update a corresponding test (unit, ztest, or hardware-in-the-loop script) or explain in the PR description why no test is possible. Fail if neither is present."

  tools:
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    flake8:
      enabled: true
    pylint:
      enabled: true
    cppcheck:
      enabled: true
    clang:
      enabled: true
    languagetool:
      enabled: true
      level: "picky"
    checkov:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
  pull_requests:
    scope: "auto"
